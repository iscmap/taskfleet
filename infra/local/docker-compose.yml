services:
  postgres:
    image: postgres:16
    container_name: taskfleet-postgres
    environment:
      POSTGRES_DB: taskfleet
      POSTGRES_USER: taskfleet
      POSTGRES_PASSWORD: taskfleet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskfleet -d taskfleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - taskfleet_pg_data:/var/lib/postgresql/data

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: taskfleet-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: taskfleet-localstack
    environment:
      SERVICES: s3,sqs
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -q running"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  taskfleet_pg_data:
